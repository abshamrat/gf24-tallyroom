# How RapidBuild builds, checks and runs this repository. Its runs read this
# file before anything else, and a command declared here is the one they
# verify a change with, in place of anything they would guess. The values
# are the saas-starter preset's (presets/saas-starter/preset.yml in
# RapidBuild); for a project created from that preset the preset is the
# authority, and this file says the same thing for everyone else.
#
# The grammar is deliberately small: `key: value` on one line, or a key with
# a `- item` list under it. A comment must be on its own line; text after a
# value is read as part of the value.
#
# What "verify" means here: install, setup, then lint, then test, each must
# exit 0 on the change as it did on the base. test needs a Postgres in
# DATABASE_URL (it migrates and seeds first), so a run without the database
# capability fails it loudly rather than skipping the part that needs one.

# Dependency lifecycle scripts stay off; the one that is ours runs in setup.
install: npm ci --no-audit --no-fund --ignore-scripts

# postinstall is `fumadocs-mdx`, which writes .source/, the MDX types that
# lint and the type check read.
setup: npm run postinstall --if-present

# `next lint` and then `tsc --noEmit`: a change that breaks a caller's types
# (a new required prop, a renamed export) fails here, not in production.
lint: npm run lint

# The preset's test command: migrate, seed, and a record saved and found
# again through the app's own data-access functions (rb-db-smoke.ts).
# `npm run test` starts with exactly this and then runs the rest of tests/.
test: npm run db:migrate && npm run db:seed && npx tsx rb-db-smoke.ts

# Every capability but the database runs on its local mock unless
# NEXT_PUBLIC_CAPABILITY_MODE=live, so DATABASE_URL is the only value a
# preview needs.
preview_command: npm run db:migrate && npm run dev
preview_port: 3000

# drizzle/migrate is the production image's migration runner, a separate
# package with its own lockfile; nothing a run changes is built there.
ignore:
  - drizzle/migrate
