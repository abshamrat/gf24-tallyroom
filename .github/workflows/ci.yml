# Every push and pull request: the migration history is one line, the schema
# has a migration for every change, and install, lint, typecheck, test and
# build are green. The browser suite runs too, as evidence: a red e2e job is
# worth reading, but it is the product's behaviour, not the commit's shape.
#
# Third-party actions are pinned to commit SHAs (the tag is in the comment):
# a tag can be moved, a SHA cannot. Images are pinned by digest for the same
# reason, and match docker-compose.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # CI runs on the local mocks: no provider keys exist here and none are needed.
  NEXT_PUBLIC_CAPABILITY_MODE: mock
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://postgres:example@localhost:5432/postgres

jobs:
  migrations:
    name: Migrations are one line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Refuses two heads (two migrations generated from the same parent, as
      # two stories on two branches produce), a sequence-numbered migration,
      # and a SQL file the journal does not list. Plain Node, no install.
      - run: node scripts/check-migration-heads.mjs

  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: example
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The install and setup a RapidBuild run uses (.rapidbuild.yml), so a
      # green here and a green there mean the same thing.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run postinstall --if-present
      # drizzle-kit check, then the two-heads check.
      - run: npm run db:check
      # next lint, then tsc --noEmit.
      - run: npm run lint
      # A schema change with no migration ships a table the database does not
      # have, and the first page that reads it answers 500. Generating must
      # produce nothing on a clean tree.
      - name: Every schema change has its migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration; run npm run db:generate and commit drizzle/"
            git status --porcelain drizzle
            exit 1
          fi
      # Migrate, seed, then the suite, against this job's Postgres 16: the
      # profile a run executes against its embedded Postgres 16.
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser suite
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: example
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run postinstall --if-present
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
